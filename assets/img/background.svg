<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600" fill="none">
  <!--
    Namestead documentation background template
    Edit the colors in the <style> block, or remove any group to simplify it.
    The central 1160px column is deliberately kept quiet for page content.
  -->
  <defs>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(208 178) rotate(42.3) scale(844 776)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0071E3" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlowRight" cx="0" cy="0" r="1" gradientTransform="translate(2384 1398) rotate(-137.7) scale(844 776)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0071E3" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1D1D1F" stop-opacity="0"/>
      <stop offset=".5" stop-color="#1D1D1F" stop-opacity=".075"/>
      <stop offset="1" stop-color="#1D1D1F" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur64" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="blur30" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1D1D1F" fill-opacity=".045"/>
    </pattern>
    <clipPath id="leftEdge"><rect width="660" height="1600"/></clipPath>
    <clipPath id="rightEdge"><rect x="1900" width="660" height="1600"/></clipPath>
  </defs>

  <!-- Base: Apple-style cool paper ground. -->
  <rect width="2560" height="1600" fill="#F5F5F7"/>
  <rect width="2560" height="1600" fill="url(#blueGlow)"/>
  <rect width="2560" height="1600" fill="url(#blueGlowRight)"/>

  <!-- Quiet texture — safely removable if a completely plain surface is preferred. -->
  <rect width="2560" height="1600" fill="url(#dotGrid)" opacity=".42"/>

  <!-- Left: abstract asset hierarchy / workflow paths. -->
  <g clip-path="url(#leftEdge)" stroke="#1D1D1F" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 318C103 318 104 478 226 478H481" stroke-opacity=".075" stroke-width="1.5"/>
    <path d="M-34 682H172C265 682 264 558 358 558H622" stroke-opacity=".065" stroke-width="1.5"/>
    <path d="M-44 1120C113 1120 105 980 262 980H616" stroke-opacity=".06" stroke-width="1.5"/>
    <path d="M109 143C109 214 175 258 255 258H585" stroke-opacity=".05" stroke-width="1.5"/>
    <circle cx="226" cy="478" r="7" fill="#F5F5F7" stroke="#0071E3" stroke-opacity=".22" stroke-width="1.5"/>
    <circle cx="358" cy="558" r="6" fill="#F5F5F7" stroke="#1D1D1F" stroke-opacity=".14" stroke-width="1.5"/>
    <circle cx="262" cy="980" r="7" fill="#F5F5F7" stroke="#0071E3" stroke-opacity=".18" stroke-width="1.5"/>
    <rect x="477" y="447" width="106" height="62" rx="12" fill="#FFF" fill-opacity=".68" stroke="#1D1D1F" stroke-opacity=".07"/>
    <rect x="495" y="467" width="40" height="5" rx="2.5" fill="#1D1D1F" fill-opacity=".11" stroke="none"/>
    <rect x="495" y="483" width="67" height="4" rx="2" fill="#1D1D1F" fill-opacity=".06" stroke="none"/>
    <rect x="474" y="949" width="118" height="62" rx="12" fill="#FFF" fill-opacity=".56" stroke="#1D1D1F" stroke-opacity=".06"/>
    <rect x="492" y="969" width="52" height="5" rx="2.5" fill="#1D1D1F" fill-opacity=".10" stroke="none"/>
    <rect x="492" y="985" width="78" height="4" rx="2" fill="#1D1D1F" fill-opacity=".06" stroke="none"/>
  </g>

  <!-- Right: sparse file/folder forms, pushed out of the reading column. -->
  <g clip-path="url(#rightEdge)" stroke="#1D1D1F" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1932 365H2134C2213 365 2204 491 2285 491H2600" stroke-opacity=".065" stroke-width="1.5"/>
    <path d="M1950 820H2176C2260 820 2253 696 2336 696H2605" stroke-opacity=".075" stroke-width="1.5"/>
    <path d="M1954 1288H2131C2224 1288 2219 1405 2317 1405H2602" stroke-opacity=".055" stroke-width="1.5"/>
    <path d="M1922 134C2075 134 2060 246 2206 246H2592" stroke-opacity=".045" stroke-width="1.5"/>
    <circle cx="2285" cy="491" r="7" fill="#F5F5F7" stroke="#0071E3" stroke-opacity=".18" stroke-width="1.5"/>
    <circle cx="2336" cy="696" r="6" fill="#F5F5F7" stroke="#1D1D1F" stroke-opacity=".14" stroke-width="1.5"/>
    <circle cx="2317" cy="1405" r="7" fill="#F5F5F7" stroke="#0071E3" stroke-opacity=".16" stroke-width="1.5"/>
    <rect x="1969" y="789" width="122" height="62" rx="12" fill="#FFF" fill-opacity=".68" stroke="#1D1D1F" stroke-opacity=".07"/>
    <rect x="1987" y="809" width="45" height="5" rx="2.5" fill="#1D1D1F" fill-opacity=".11" stroke="none"/>
    <rect x="1987" y="825" width="80" height="4" rx="2" fill="#1D1D1F" fill-opacity=".06" stroke="none"/>
    <rect x="1988" y="1257" width="118" height="62" rx="12" fill="#FFF" fill-opacity=".56" stroke="#1D1D1F" stroke-opacity=".06"/>
    <rect x="2006" y="1277" width="48" height="5" rx="2.5" fill="#1D1D1F" fill-opacity=".10" stroke="none"/>
    <rect x="2006" y="1293" width="75" height="4" rx="2" fill="#1D1D1F" fill-opacity=".06" stroke="none"/>
  </g>

  <!-- Edge-focused glows provide depth without obscuring type. The centre lift stays faint: at
       background-size cover on a wide display the middle of the artwork lands beside the hero,
       where anything stronger reads as a white wash rather than as depth. -->
  <circle cx="106" cy="178" r="150" fill="#0071E3" fill-opacity=".06" filter="url(#blur64)"/>
  <circle cx="2426" cy="1410" r="164" fill="#0071E3" fill-opacity=".05" filter="url(#blur64)"/>
  <ellipse cx="1280" cy="792" rx="430" ry="258" fill="#FFF" fill-opacity=".12" filter="url(#blur30)"/>

  <!-- Gentle horizontal structure, almost imperceptible behind a long document. -->
  <rect x="616" y="184" width="1328" height="1" fill="url(#lineFade)"/>
  <rect x="616" y="1415" width="1328" height="1" fill="url(#lineFade)"/>
</svg>
